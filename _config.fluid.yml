#   banner_img_height: 65
#   banner_mask_alpha: 0



archive:
  banner_img: https://raw.githubusercontent.com/Luyoung0001/picBed/main/8.jpg
  banner_img_height: 65
  banner_mask_alpha: 0


category:
  banner_img: https://raw.githubusercontent.com/Luyoung0001/picBed/main/6.jpg
  banner_img_height: 65
  banner_mask_alpha: 0


tag:
  banner_img: https://raw.githubusercontent.com/Luyoung0001/picBed/main/5.jpg
  banner_img_height: 65
  banner_mask_alpha: 0


about:
  avatar: https://raw.githubusercontent.com/Luyoung0001/picBed/main/low.png
  name: "Luyoung"
  intro: "记录学习的痕迹和一些感想。"
  banner_img: https://raw.githubusercontent.com/Luyoung0001/picBed/main/4.jpg
  banner_img_height: 65
  banner_mask_alpha: 0
  icons:
    - { class: 'iconfont icon-github-fill', link: 'https://github.com/Luyoung0001', tip: 'GitHub' }
    - { class: 'iconfont icon-wechat-fill', link: 'https://raw.githubusercontent.com/Luyoung0001/picBed/main/WechatIMG315.jpg'}

index:
  slogan:
    enable: true
    text: Welcome to Visit My Blogs!
    api:
      enable: false
      url: "https://v1.hitokoto.cn/"
      method: "GET"
      headers: {}
      keys: ["hitokoto"]
  banner_img: https://raw.githubusercontent.com/Luyoung0001/picBed/main/7.jpg
  banner_img_height: 65
  banner_mask_alpha: 0

page404:
  banner_img: https://raw.githubusercontent.com/Luyoung0001/picBed/main/trees.jpg
  banner_img_height: 65
  banner_mask_alpha: 0

links:
  banner_img: https://raw.githubusercontent.com/Luyoung0001/picBed/main/trees.jpg
  banner_img_height: 65
  banner_mask_alpha: 0


lazyload:
    enable: false
    loading_img: /img/loading.gif
    onlypost: false
    offset_factor: 2

font:
    font_size: 16px        # 全局字号
    font_family:           # 全局字体族
    code_font_size: 85%    # 代码的字号


author: Luyoung
language: zh-CN
timezone: 'Asia/Shanghai'


code:
  copy_btn: true
  highlight:
    enable: true
    line_number: true
    lib: "highlightjs"
    highlightjs:
      style: 'Github Gist'
      bg_color: false
    prismjs:
      style: "default"
      preprocess: true

dark_mode:
  enable: true
  default: dark #auto / light / dark


# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: http://blog.luliang.online
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
# index_generator:
#   path: ''
#   per_page: 7
#   order_by: -date

# # Category & Tag
# default_category: uncategorized
# category_map:
# tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 7
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: fluid

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: git@github.com:Luyoung0001/Luyoung0001.github.io.git
  branch: main




footer:
  statistics:
    enable: true
    source: "busuanzi"  # 可选 leancloud | busuanzi  根据自己需求选择
    pv_format: "总访问量 {} 次"  # 显示的文本，{}是数字的占位符（必须包含)，下同
    uv_format: "总访客数 {} 人"
