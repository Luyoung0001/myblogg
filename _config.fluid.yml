# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Sit

favicon: https://raw.githubusercontent.com/Luyoung0001/picBed/main/low.png # 网站图标

navbar:
    blog_title: Luyoung
    menu:
    - { key: 'home', link: '/', icon: 'iconfont icon-home-fill', name: '首页'}
    - { key: 'archive', link: '/archives/', icon: 'iconfont icon-archive-fill', name: '归档'}
    - { key: 'category', link: '/categories/', icon: 'iconfont icon-category-fill' ,name: '分类'}
    - { key: 'tag', link: '/tags/', icon: 'iconfont icon-tags-fill', name: '标签'}
    - { key: 'about', link: '/about/', icon: 'iconfont icon-user-fill', name: '关于' }
    # - { key: 'dreams', link: '/dreams/', icon: 'iconfont icon-user-fill', name: '梦境' }
    # - { key: 'opinion', link: '/opinions/', icon: 'iconfont icon-user-fill', name: '观点' }

post:
  default_index_img: https://raw.githubusercontent.com/Luyoung0001/picBed/main/cat2_4article_face.jpg # 文章封面图
  banner_img: https://raw.githubusercontent.com/Luyoung0001/picBed/main/1.jpg # 文章背景图
  banner_img_height: 65
  banner_mask_alpha: 0
  
  mermaid:
    enable: true
    specific: false
    options: {theme: 'default'}

# 页面背景图

